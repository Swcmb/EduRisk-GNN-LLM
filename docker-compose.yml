services:
  app:
    build: .
    container_name: edurisk-app
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./instance:/app/instance
    environment:
      - SECRET_KEY=dev-secret-key-for-docker
      - FLASK_ENV=development
    restart: unless-stopped
