<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习路径推荐系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 30px;
        }
        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #343a40;
            color: white;
        }
        .learning-path {
            list-style-type: none;
            padding: 0;
        }
        .learning-path li {
            padding: 10px;
            margin-bottom: 5px;
            background-color: #e9ecef;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .learning-path li:hover {
            background-color: #dee2e6;
            transform: translateX(5px);
        }
        .learning-path li::before {
            content: "→";
            margin-right: 10px;
            color: #6c757d;
        }
        #recommendation-chart {
            height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-5">学习路径推荐系统</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>学生信息</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="student-id">学生ID</label>
                            <input type="number" class="form-control" id="student-id" placeholder="输入学生ID">
                        </div>
                        <button id="get-recommendation" class="btn btn-primary mt-3">获取推荐</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5>已完成课程</h5>
                    </div>
                    <div class="card-body">
                        <ul id="completed-courses" class="learning-path">
                            <!-- 已完成课程将在这里显示 -->
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>推荐课程</h5>
                    </div>
                    <div class="card-body">
                        <ul id="recommended-courses" class="learning-path">
                            <!-- 推荐课程将在这里显示 -->
                        </ul>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5>学习路径</h5>
                    </div>
                    <div class="card-body">
                        <ul id="learning-path" class="learning-path">
                            <!-- 学习路径将在这里显示 -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-5">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>推荐可视化</h5>
                    </div>
                    <div class="card-body">
                        <div id="recommendation-chart"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 数据将通过API调用获取
        
        document.getElementById('get-recommendation').addEventListener('click', function() {
            const studentId = document.getElementById('student-id').value;
            if (!studentId) {
                alert('请输入学生ID');
                return;
            }
            
            // 通过API获取推荐数据
            fetch(`/get-recommendations/${studentId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const recommendation = data.recommendations;
                        
                        // 更新已完成课程
                        const completedCoursesList = document.getElementById('completed-courses');
                        completedCoursesList.innerHTML = '';
                        if (recommendation.completed_courses) {
                            recommendation.completed_courses.forEach(course => {
                                const li = document.createElement('li');
                                li.textContent = course;
                                completedCoursesList.appendChild(li);
                            });
                        }
                        
                        // 更新推荐课程
                        const recommendedCoursesList = document.getElementById('recommended-courses');
                        recommendedCoursesList.innerHTML = '';
                        if (recommendation.recommended_courses) {
                            recommendation.recommended_courses.forEach(course => {
                                const li = document.createElement('li');
                                li.textContent = course;
                                recommendedCoursesList.appendChild(li);
                            });
                        }
                        
                        // 更新学习路径
                        const learningPathList = document.getElementById('learning-path');
                        learningPathList.innerHTML = '';
                        if (recommendation.learning_path) {
                            recommendation.learning_path.forEach((course, index) => {
                                const li = document.createElement('li');
                                li.textContent = `第${index + 1}步: ${course}`;
                                learningPathList.appendChild(li);
                            });
                        }
                        
                        // 绘制推荐可视化图表
                        drawRecommendationChart(recommendation);
                    } else {
                        alert('获取推荐数据失败');
                    }
                })
                .catch(error => {
                    console.error('获取推荐数据失败:', error);
                    alert('获取推荐数据失败');
                });
        });
        
        function drawRecommendationChart(recommendation) {
            const chart = echarts.init(document.getElementById('recommendation-chart'));
            
            const nodes = [];
            const links = [];
            
            // 添加已完成课程节点
            recommendation.completed_courses.forEach(course => {
                nodes.push({
                    name: course,
                    symbolSize: 50,
                    itemStyle: {
                        color: '#52c41a'
                    }
                });
            });
            
            // 添加推荐课程节点
            recommendation.recommended_courses.forEach(course => {
                nodes.push({
                    name: course,
                    symbolSize: 40,
                    itemStyle: {
                        color: '#1890ff'
                    }
                });
            });
            
            // 添加路径连接
            for (let i = 0; i < recommendation.learning_path.length - 1; i++) {
                links.push({
                    source: recommendation.learning_path[i],
                    target: recommendation.learning_path[i + 1],
                    lineStyle: {
                        width: 2,
                        color: '#666'
                    }
                });
            }
            
            // 添加已完成课程到学习路径的连接
            if (recommendation.completed_courses.length > 0 && recommendation.learning_path.length > 0) {
                links.push({
                    source: recommendation.completed_courses[recommendation.completed_courses.length - 1],
                    target: recommendation.learning_path[0],
                    lineStyle: {
                        width: 2,
                        color: '#666',
                        type: 'dashed'
                    }
                });
            }
            
            const option = {
                title: {
                    text: '学习路径可视化',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'item'
                },
                animationDurationUpdate: 1500,
                animationEasingUpdate: 'quinticInOut',
                series: [
                    {
                        type: 'graph',
                        layout: 'force',
                        force: {
                            repulsion: 100,
                            edgeLength: [80, 120]
                        },
                        roam: true,
                        label: {
                            show: true
                        },
                        data: nodes,
                        links: links,
                        lineStyle: {
                            opacity: 0.9,
                            width: 2,
                            curveness: 0
                        }
                    }
                ]
            };
            
            chart.setOption(option);
        }
    </script>
</body>
</html>
